version: 2
updates:
    # GitHub Actions
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
          time: "00:00"
          timezone: "Etc/UTC"
      cooldown:
          default-days: 1
          include:
              - "*"
      commit-message:
          prefix: "chore"
    # NPM
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "daily"
          time: "00:00"
          timezone: "Etc/UTC"
      cooldown:
          default-days: 1
          include:
              - "*"
      commit-message:
          prefix: "chore"
    # Cargo
    - package-ecosystem: "cargo"
      directory: "/"
      schedule:
          interval: "daily"
          time: "00:00"
          timezone: "Etc/UTC"
      cooldown:
          default-days: 1
          include:
              - "*"
      commit-message:
          prefix: "chore"
      ignore:
          - dependency-name: "syn"
            update-types:
                - "version-update:semver-minor"
                - "version-update:semver-patch"
          - dependency-name: "quote"
            update-types:
                - "version-update:semver-minor"
                - "version-update:semver-patch"
          - dependency-name: "proc-macro2"
            update-types:
                - "version-update:semver-minor"
                - "version-update:semver-patch"
          - dependency-name: "serde"
            update-types:
                - "version-update:semver-minor"
                - "version-update:semver-patch"
          - dependency-name: "serde_json"
            update-types:
                - "version-update:semver-minor"
                - "version-update:semver-patch"
          - dependency-name: "utoipa"
            update-types:
                - "version-update:semver-minor"
                - "version-update:semver-patch"
